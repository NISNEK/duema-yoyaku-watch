<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>デュエマ予約確認</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2127; --sub: #5f6b7a; --line: #e2e6eb;
    --up: #0f8a4a; --down: #d23c3c; --accent: #1f6feb; --other: #b26b00; --good: #0f8a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e7eaee; --sub: #9aa5b1; --line: #2b323b;
      --up: #4ad08a; --down: #ff6b6b; --accent: #58a6ff; --other: #f0b44c; --good: #4ad08a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 8px 0 12px; }
  .tabs a { padding: 8px 18px; color: var(--sub); text-decoration: none; font-weight: 600;
            border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  .meta { color: var(--sub); font-size: .85rem; margin-bottom: 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips + .chips { margin-top: 8px; }
  .chips.row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  .chips.row::-webkit-scrollbar { display: none; }
  .chips.row button { flex: none; white-space: nowrap; padding: 5px 10px; font-size: .82rem; }
  .chips .sep { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 2px 3px; }
  .chips .lbl { color: var(--sub); font-size: .78rem; margin-right: 2px; }
  .chips button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .picker { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .picker img { width: 52px; height: 72px; object-fit: contain; border-radius: 4px; background: var(--bg); flex: none; }
  .picker select { flex: 1; min-width: 0; font-size: 1rem; padding: 8px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--card); color: var(--text); }
  input[type=search] { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--card);
                       color: var(--text); border-radius: 8px; padding: 7px 10px; font-size: .95rem; }
  .cardlist { list-style: none; margin: 10px 0 0; padding: 0; max-height: 340px; overflow-y: auto;
              border-top: 1px solid var(--line); }
  .cardlist li { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cardlist li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .cardlist img { width: 36px; height: 50px; object-fit: contain; border-radius: 3px; background: var(--bg); flex: none; }
  .cardlist .nm { flex: 1; min-width: 0; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cardlist .pr { text-align: right; font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }
  .cardlist .pr small { display: block; font-size: .72rem; color: var(--sub); }
  .tag { font-size: .7rem; color: var(--sub); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .selected { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .selected img { width: 52px; height: 72px; object-fit: contain; border-radius: 4px; background: var(--bg); flex: none; }
  .selected .nm { font-weight: 800; font-size: 1.5rem; line-height: 1.3; }
  #chart { width: 100%; height: 340px; }
  .prices { display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 12px; align-items: baseline;
            font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
  .prices .day { grid-column: 1 / -1; color: var(--sub); font-size: .8rem; }
  .prices .shop { font-size: .82rem; white-space: nowrap; }
  .prices .shop .best { color: var(--good); font-weight: 700; margin-left: 4px; }
  .prices .v { font-weight: 700; white-space: nowrap; }
  .prices .v small { color: var(--sub); font-weight: 400; font-size: .72rem; margin-right: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--sub); margin-top: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .graphpanel { display: flex; flex-direction: column; }
  .graphpanel > * { min-width: 0; }
  .cardhead { display: contents; }
  .cardhead .stats { order: 9; margin: 10px 0 0; display: block; }
  .hero { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .hero .label { color: var(--sub); font-size: .8rem; }
  .hero .now { font-size: 2rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .hero .chg { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hero .chg small { font-size: .75rem; font-weight: 400; color: var(--sub); margin-left: 8px; }
  .hero .chg.flat { color: var(--sub); }
  .minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ctrl { min-width: 0; }
  @media (min-width: 760px) {
    .graphpanel { display: block; }
    .cardhead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: start; }
    .cardhead .stats { margin: 0; }
  }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .label { color: var(--sub); font-size: .78rem; }
  .stat .note { color: var(--sub); font-size: .72rem; }
  .stat .value { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .links a { color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
             border-radius: 999px; padding: 2px 12px; font-size: .85rem; }
  .empty { color: var(--sub); text-align: center; padding: 30px 12px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  footer { color: var(--sub); font-size: .78rem; margin: 20px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>デュエマ予約確認</h1>
  <nav class="tabs" aria-label="ページの切り替え">
    <a href="index.html">予約</a>
    <a href="single.html">シングル</a>
    <a href="chart.html" aria-current="page">相場</a>
  </nav>
  <div class="meta" id="meta">読み込み中…</div>

  <!-- どのグラフを見るか（登録カード／新弾） -->
  <section class="panel">
    <div class="chips" id="modes" role="toolbar" aria-label="見る対象"></div>

    <!-- 登録カード -->
    <div id="regBox">
      <div class="picker">
        <img id="regImg" alt="" hidden>
        <select id="regCard" aria-label="カードを選ぶ"></select>
      </div>
    </div>

    <!-- 新弾 -->
    <div id="setBox" hidden>
      <div class="chips" id="frames" style="margin-top:10px" role="toolbar" aria-label="枠"></div>
      <div class="chips" id="rarities" role="toolbar" aria-label="レアリティ"></div>
      <input type="search" id="q" placeholder="カード名で絞り込み" aria-label="カード名で絞り込み">
      <ul class="cardlist" id="cardlist" aria-label="カード一覧"></ul>
    </div>
  </section>

  <!-- グラフ -->
  <section class="panel graphpanel">
    <!-- お店・メルカリへのリンクは、一覧から選んですぐ押せるように一番上に -->
    <div class="links" id="links"></div>
    <!-- PC：カード名・ボタンの右に数字（株の画面のように）。スマホ：数字はグラフの下 -->
    <div class="cardhead">
      <div class="ctrl">
        <div class="selected" id="selected"></div>
        <div class="chips row" id="variants" role="toolbar" aria-label="状態・枠"></div>
        <div class="chips row" style="margin:8px 0" role="toolbar" aria-label="グラフにするお店">
          <button data-shop="torecat" aria-pressed="true">トレキャット</button>
          <button data-shop="amenity" aria-pressed="false">アメニティ</button>
        </div>
        <div class="chips row" style="margin:8px 0" role="toolbar" aria-label="グラフの形と期間">
          <button data-ctype="candle" aria-pressed="true">ろうそく型</button>
          <button data-ctype="line" aria-pressed="false">線型</button>
          <span class="sep" aria-hidden="true"></span>
          <button data-range="30" aria-pressed="true">1か月</button>
          <button data-range="90" aria-pressed="false">3か月</button>
          <button data-range="365" aria-pressed="false">1年</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="prices" id="prices" aria-live="polite"></div>
    <div id="chart" role="img" aria-label="値段のグラフ"></div>
    <div class="empty" id="empty" hidden>このお店の記録はまだありません。毎日記録していきます。</div>
    <div class="legend">
      <span class="lg-candle"><span class="dot" style="background:var(--up)"></span>上がった日（陽線）</span>
      <span class="lg-candle"><span class="dot" style="background:var(--down)"></span>下がった日（陰線）</span>
      <span class="lg-line" hidden><span class="dot" style="background:var(--accent)"></span><span id="lineName">お店</span>の値段（線）</span>
    </div>
  </section>


  <details id="archiveBox" hidden>
    <summary>過去の弾のまとめ（発売から3か月の結果）</summary>
    <div id="archive"></div>
  </details>

  <footer>
    登録カード：トレキャット・アメニティードリームの「在庫のある一番安い美品の値段」を見回りのたびに記録。<br>
    新弾：トレキャット・アメニティードリームの値段を1日1回（深夜〜朝）記録（始値＝前日の値段）。発売から3か月で結果だけをまとめて、毎日のデータは消します。<br>
    どちらもお店の販売価格で、メルカリなどの個人売買の相場ではありません。
  </footer>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<script>
const SHOPS = { torecat: "トレキャット", amenity: "アメニティードリーム" };
const SHORT = { torecat: "トレキャット", amenity: "アメニティ" };
const FRAME_LABEL = { "㊙": "㊙ シークレット", "通常": "通常" };
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const el = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    // お店のデータに変なリンク（javascript: など）が混ざっても使わない
    if ((k === "href" || k === "src") && !/^(https?:|[\w.-]+\.html)/i.test(String(v))) continue;
    e.setAttribute(k, v);
  }
  if (text !== undefined) e.textContent = text;
  return e;
};
const yen = (n) => n == null ? "—" : Math.round(n).toLocaleString("ja-JP") + "円";
const small = (src, w) => src && src.includes("cdn.shopify.com") ? src + (src.includes("?") ? "&" : "?") + "width=" + w : src;
const pressOnly = (group, btn) => group.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
const lastClose = (rows) => rows && rows.length ? rows[rows.length - 1][4] : null;

let showImages = true, range = 30, shop = "torecat", ctype = "candle";   // ctype: "candle"＝ろうそく型、"line"＝線型
let mode = "reg";                      // "reg" = 登録カード、それ以外 = 弾のコード
let regIndex = { cards: [] }, regData = null;
let setData = null, frame = "all", rarity = "all", cardName = null, variantKey = null;
let view = null;                       // いまグラフに出しているもの { name, img, series: {torecat, amenity}, urls: {...} }

// 値段が動いていない（全部同じ金額）時でも目盛りが重ならないよう、上下に少なくとも±5%の余白を取る
const roomyScale = (original) => {
  const r = original();
  if (!r || !r.priceRange) return r;
  const { minValue, maxValue } = r.priceRange;
  const pad = Math.max((maxValue - minValue) * 0.1, maxValue * 0.05, 10);
  return { ...r, priceRange: { minValue: Math.max(0, minValue - pad), maxValue: maxValue + pad } };
};
const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  autoSize: true,
  layout: { background: { color: "transparent" }, textColor: css("--sub"), fontSize: 11 },
  grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
  rightPriceScale: { borderColor: css("--line") },
  timeScale: { borderColor: css("--line") },
  localization: { locale: "ja-JP", priceFormatter: (p) => Math.round(p).toLocaleString("ja-JP") + "円" },
});
const candles = chart.addCandlestickSeries({
  upColor: css("--up"), downColor: css("--down"), borderUpColor: css("--up"), borderDownColor: css("--down"),
  wickUpColor: css("--up"), wickDownColor: css("--down"), autoscaleInfoProvider: roomyScale,
});
const other = chart.addLineSeries({ color: css("--accent"), lineWidth: 2, priceLineVisible: false, lastValueVisible: true,
                                    autoscaleInfoProvider: roomyScale });

const since = () => new Date(Date.now() - range * 864e5).toISOString().slice(0, 10);
const inRange = (rows) => (rows || []).filter(r => r[0] >= since());

// ---------- 両方のお店の 1枚・4枚 の値段（指でなぞった日、なぞっていない時は最新の日） ----------
function showPrices(day) {
  const box = document.getElementById("prices");
  box.replaceChildren();
  if (!view) return;
  const pick = (rows) => {
    rows = inRange(rows);
    if (!rows.length) return null;
    if (!day) return rows[rows.length - 1];
    return [...rows].reverse().find(r => r[0] <= day) || null;    // その日の値段（無ければ直前の日）
  };
  const rows = { torecat: pick(view.series.torecat), amenity: pick(view.series.amenity) };
  const shown = Object.values(rows).filter(Boolean);
  if (!shown.length) return;
  const label = day || shown.map(r => r[0]).sort().pop();
  box.append(el("div", { class: "day" }, label.slice(5).replace("-", "/") + (day ? "" : "（最新）")));
  const prices = Object.entries(rows).filter(([, r]) => r).map(([k, r]) => [k, r[4]]);
  const best = prices.length > 1 ? Math.min(...prices.map(p => p[1])) : null;
  for (const [k, r] of Object.entries(rows)) {
    const name = el("div", { class: "shop" }, SHORT[k]);
    if (r && best != null && r[4] === best) name.append(el("span", { class: "best" }, "✅安い"));
    const one = el("div", { class: "v" }), four = el("div", { class: "v" });
    one.append(el("small", {}, "1枚"), document.createTextNode(r ? yen(r[4]) : "—"));
    four.append(el("small", {}, "4枚"), document.createTextNode(r ? yen(r[4] * 4) : "—"));
    box.append(name, one, four);
  }
}
chart.subscribeCrosshairMove((param) => {
  if (!param || !param.time) { showPrices(null); return; }
  const t = typeof param.time === "string" ? param.time
    : `${param.time.year}-${String(param.time.month).padStart(2, "0")}-${String(param.time.day).padStart(2, "0")}`;
  showPrices(t);
});

// ---------- グラフと数字 ----------
function draw() {
  // 選んだお店1つだけを、選んだ形（ろうそく型か線型）で描く。2店の比較は上の値段の欄で見る
  const rows = inRange(view && view.series[shop]);
  candles.setData(ctype === "candle" ? rows.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] })) : []);
  other.setData(ctype === "line" ? rows.map(r => ({ time: r[0], value: r[4] })) : []);
  document.querySelectorAll(".lg-candle").forEach(x => x.hidden = ctype !== "candle");
  document.querySelectorAll(".lg-line").forEach(x => x.hidden = ctype !== "line");
  document.getElementById("lineName").textContent = SHOPS[shop];
  requestAnimationFrame(() => setTimeout(() => chart.timeScale().fitContent(), 50));
  document.getElementById("empty").hidden = rows.length > 0;
  document.getElementById("chart").style.visibility = rows.length ? "visible" : "hidden";
  showPrices(null);

  // 株の画面のように：いまの値段と前日比を大きく、その下に細かい数字
  const stats = document.getElementById("stats");
  stats.replaceChildren();
  const last = rows[rows.length - 1], prev = rows[rows.length - 2];
  const hero = el("div", { class: "hero" });
  hero.append(el("div", { class: "label" }, SHORT[shop] + "（" + (last ? last[0].slice(5).replace("-", "/") : "—") + "）"),
              el("div", { class: "now" }, last ? yen(last[4]) : "—"));
  if (last && prev) {
    const diff = last[4] - prev[4], pct = prev[4] ? diff / prev[4] * 100 : 0;
    const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
    const sign = diff > 0 ? "▲ +" : diff < 0 ? "▼ " : "± ";
    const chg = el("div", { class: "chg " + cls }, sign + Math.round(diff).toLocaleString("ja-JP") + "円（" + (pct > 0 ? "+" : "") + pct.toFixed(1) + "%）");
    chg.append(el("small", {}, "前日比"));
    hero.append(chg);
  } else hero.append(el("div", { class: "chg flat" }, "前日比 —"));
  stats.append(hero);
  const minis = el("div", { class: "minis" });
  stats.append(minis);
  const add = (label, value, cls, note) => {
    const box = el("div", { class: "stat" });
    box.append(el("div", { class: "label" }, label), el("div", { class: "value " + (cls || "") }, value));
    if (note) box.append(el("div", { class: "note" }, note));
    minis.append(box);
  };
  add("期間の最高", yen(rows.length ? Math.max(...rows.map(r => r[2])) : null));
  add("期間の最安", yen(rows.length ? Math.min(...rows.map(r => r[3])) : null));
  const a = lastClose(inRange(view && view.series.torecat)), b = lastClose(inRange(view && view.series.amenity));
  if (a != null && b != null) add("お店の差", a === b ? "同じ値段" : yen(Math.abs(a - b)), "", a === b ? "" : (a < b ? "トレキャット" : "アメニティ") + "が安い");

  const links = document.getElementById("links");
  links.replaceChildren();
  if (!view) return;
  if (view.urls.torecat) links.append(el("a", { href: view.urls.torecat, target: "_blank", rel: "noopener" }, "トレキャットで見る"));
  if (view.urls.amenity) links.append(el("a", { href: view.urls.amenity, target: "_blank", rel: "noopener" }, "アメニティードリームで見る"));
  links.append(el("a", { href: "https://jp.mercari.com/search?keyword=" + encodeURIComponent("デュエマ " + view.baseName) + "&status=on_sale",
                         target: "_blank", rel: "noopener" }, "メルカリで探す"));
}

function showSelected() {
  const box = document.getElementById("selected");
  box.replaceChildren();
  if (!view) return;
  if (showImages && view.img) box.append(el("img", { src: small(view.img, 200), alt: "", loading: "lazy" }));
  box.append(el("div", { class: "nm" }, view.name));
}

// ---------- 登録カード ----------
function renderReg() {
  document.getElementById("variants").replaceChildren();
  const meta = regIndex.cards.find(c => regData && c.name === regData.name) || {};
  view = regData ? { name: regData.name, baseName: regData.name, img: regData.img || meta.img,
                     series: { torecat: regData.series.torecat || [], amenity: regData.series.amenity || [] }, urls: {} } : null;
  showSelected();
  draw();
}

async function loadReg(id) {
  try { regData = await fetch("prices/" + id + ".json?t=" + Date.now()).then(r => r.json()); }
  catch { regData = null; }
  const meta = regIndex.cards.find(c => c.id === id);
  const img = document.getElementById("regImg");
  img.hidden = !(showImages && meta && meta.img);
  if (!img.hidden) img.src = small(meta.img, 120);
  renderReg();
}

// ---------- 新弾 ----------
const matches = (v) => (frame === "all" || v.frame === frame) && (rarity === "all" || v.rarity === rarity);

function mainVariant(card) {
  const vs = Object.entries(card.variants);
  return vs.find(([, v]) => matches(v) && v.cond === "美品") || vs.find(([, v]) => matches(v)) || vs[0];
}

function renderCardList() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("cardlist");
  list.replaceChildren();
  const rows = Object.entries(setData.cards)
    .filter(([, c]) => Object.values(c.variants).some(matches))
    .filter(([n]) => !q || n.toLowerCase().includes(q))
    .map(([n, c]) => {
      const [k, v] = mainVariant(c);
      const t = lastClose(v.series), a = lastClose(v.amenity);
      const best = [["torecat", t], ["amenity", a]].filter(p => p[1] != null).sort((x, y) => x[1] - y[1])[0];
      return { n, c, k, v, best };
    })
    .sort((x, y) => (y.best ? y.best[1] : 0) - (x.best ? x.best[1] : 0));
  if (!rows.length) { list.append(el("li", { class: "empty" }, "該当するカードはありません")); return; }
  for (const r of rows) {
    const li = el("li", { role: "option", "aria-selected": String(r.n === cardName) });
    if (showImages && r.v.img) li.append(el("img", { src: small(r.v.img, 120), alt: "", loading: "lazy" }));
    const nm = el("div", { class: "nm" }, r.n);
    if (r.v.rarity) nm.append(el("span", { class: "tag" }, r.v.rarity));
    const kinds = Object.keys(r.c.variants).length;
    if (kinds > 1) nm.append(el("span", { class: "tag" }, kinds + "種"));
    const pr = el("div", { class: "pr" }, r.best ? yen(r.best[1]) : "—");
    if (r.best) pr.append(el("small", {}, "最安：" + SHORT[r.best[0]]));
    // 昨日との差：いちばん安いお店の記録で計算。そのお店に2日分の記録が無ければ、もう一方のお店で計算する
    const order = r.best && r.best[0] === "amenity" ? ["amenity", "torecat"] : ["torecat", "amenity"];
    for (const sh of order) {
      const rows = sh === "torecat" ? r.v.series : r.v.amenity;
      if (!rows || rows.length < 2) continue;
      const prev = rows[rows.length - 2][4], last = rows[rows.length - 1][4];
      if (!prev) continue;
      const pct = (last - prev) / prev * 100;
      const note = r.best && sh !== r.best[0] ? "（" + (sh === "torecat" ? "トレ" : "アメ") + "）" : "";
      const pctText = (x) => (x >= 0 ? "+" : "") + x.toFixed(1) + "%";
      const cls = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
      pr.append(el("small", { class: cls(pct) }, "前日比 " + pctText(pct) + note));
      // 発売から：同じお店の、記録の最初の日の値段と比べる
      const first = rows[0][4];
      if (first) {
        const since = (last - first) / first * 100;
        pr.append(el("small", { class: cls(since) }, "発売から " + pctText(since) + note));
      }
      break;
    }
    li.append(nm, pr);
    li.addEventListener("click", () => { cardName = r.n; variantKey = r.k; renderCardList(); renderSetCard(); });
    list.append(li);
  }
}

function renderSetCard() {
  const variants = document.getElementById("variants");
  variants.replaceChildren();
  const card = cardName && setData.cards[cardName];
  if (!card) { view = null; showSelected(); draw(); return; }
  if (!card.variants[variantKey]) variantKey = mainVariant(card)[0];
  const entries = Object.entries(card.variants).sort(([, a], [, b]) => (a.frame + a.cond).localeCompare(b.frame + b.cond, "ja"));
  if (entries.length > 1) {
    const mixed = new Set(entries.map(([, v]) => v.rarity || "")).size > 1;
    for (const [k, v] of entries) {
      const b = el("button", { "aria-pressed": String(k === variantKey) },
                   v.frame + "・" + v.cond + (mixed && v.rarity ? "（" + v.rarity + "）" : ""));
      b.addEventListener("click", () => { variantKey = k; renderSetCard(); });
      variants.append(b);
    }
  }
  const v = card.variants[variantKey];
  view = { name: cardName + "（" + (v.number || v.frame) + "・" + v.cond + (v.rarity ? "・" + v.rarity : "") + "）", baseName: cardName,
           img: v.img, series: { torecat: v.series || [], amenity: v.amenity || [] },
           urls: { torecat: v.url, amenity: v.amenity_url } };
  showSelected();
  draw();
}

function chipRow(boxId, values, current, labelOf, onPick) {
  const box = document.getElementById(boxId);
  box.replaceChildren();
  if (!values.length) return;
  for (const val of ["all", ...values]) {
    const b = el("button", { "aria-pressed": String(val === current) }, val === "all" ? labelOf(null) : labelOf(val));
    b.addEventListener("click", () => { pressOnly(box, b); onPick(val); });
    box.append(b);
  }
}

async function loadSet(code) {
  try { setData = await fetch("prices/sets/" + code + ".json?t=" + Date.now()).then(r => r.json()); }
  catch { setData = { cards: {}, frames: [] }; }
  frame = "all"; rarity = "all"; cardName = null;
  chipRow("frames", setData.frames || [], frame, (f) => f ? (FRAME_LABEL[f] || f) : "全部の枠", (f) => { frame = f; renderCardList(); });
  chipRow("rarities", setData.rarities || [], rarity, (r) => r || "全レアリティ", (r) => { rarity = r; renderCardList(); });
  const first = Object.entries(setData.cards).map(([n, c]) => [n, mainVariant(c)])
    .sort((a, b) => (lastClose(b[1][1].series) || 0) - (lastClose(a[1][1].series) || 0))[0];
  if (first) { cardName = first[0]; variantKey = first[1][0]; }
  renderCardList();
  renderSetCard();
}

// ---------- 切り替え ----------
function setMode(m, btn) {
  mode = m;
  pressOnly(document.getElementById("modes"), btn);
  document.getElementById("regBox").hidden = m !== "reg";
  document.getElementById("setBox").hidden = m === "reg";
  if (m === "reg") { if (regIndex.cards.length) loadReg(document.getElementById("regCard").value); else renderReg(); }
  else loadSet(m);
}

document.querySelectorAll("[data-shop]").forEach(b => b.addEventListener("click", () => {
  shop = b.dataset.shop;
  document.querySelectorAll("[data-shop]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  draw();
}));
document.querySelectorAll("[data-ctype]").forEach(b => b.addEventListener("click", () => {
  ctype = b.dataset.ctype;
  document.querySelectorAll("[data-ctype]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  draw();
}));
document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
  range = Number(b.dataset.range);
  document.querySelectorAll("[data-range]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  draw();
}));
document.getElementById("regCard").addEventListener("change", (e) => loadReg(e.target.value));
document.getElementById("q").addEventListener("input", renderCardList);

function renderArchive(archive) {
  const sets = (archive && archive.sets) || [];
  if (!sets.length) return;
  const box = document.getElementById("archive");
  for (const s of sets) {
    box.append(el("h2", {}, s.code + "（" + s.first_seen + " 発売・上位10枚）"));
    const t = el("table");
    const head = el("tr");
    ["カード", "最初", "最後", "最高", "変化"].forEach((h, i) => head.append(el("th", i ? { class: "num" } : {}, h)));
    t.append(head);
    for (const c of s.cards.slice(0, 10)) {
      const tr = el("tr");
      tr.append(el("td", {}, c.name + (c.frame !== "通常" ? "（" + c.frame + "）" : "") + (c.cond !== "美品" ? "【" + c.cond + "】" : "")));
      [yen(c.first), yen(c.last), yen(c.high)].forEach(v => tr.append(el("td", { class: "num" }, v)));
      tr.append(el("td", { class: "num " + (c.change > 0 ? "up" : c.change < 0 ? "down" : "") }, (c.change >= 0 ? "+" : "") + c.change + "%"));
      t.append(tr);
    }
    box.append(t);
  }
  document.getElementById("archiveBox").hidden = false;
}

const get = (url, fallback) => fetch(url + "?t=" + Date.now()).then(r => r.ok ? r.json() : fallback).catch(() => fallback);
Promise.all([
  get("prices/index.json", { cards: [] }),
  get("prices/sets/index.json", { sets: [] }),
  get("prices/sets/archive.json", { sets: [] }),
  get("single.json", {}),
]).then(([reg, sets, archive, single]) => {
  regIndex = reg;
  showImages = single.show_images !== false;
  document.getElementById("meta").textContent = "記録の更新 " +
    new Date(reg.updated || sets.updated || Date.now()).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

  const select = document.getElementById("regCard");
  if (reg.cards.length) for (const c of reg.cards) select.append(el("option", { value: c.id }, c.name + (c.active ? "" : "（登録終了）")));
  else select.append(el("option", {}, "（登録カードの記録はまだありません）"));

  const modes = document.getElementById("modes");
  const regBtn = el("button", { "aria-pressed": "true" }, "登録カード");
  regBtn.addEventListener("click", () => setMode("reg", regBtn));
  modes.append(regBtn);
  let firstSet = null;
  for (const s of sets.sets || []) {
    const b = el("button", { "aria-pressed": "false" }, "新弾 " + s.code);
    b.addEventListener("click", () => setMode(s.code, b));
    modes.append(b);
    firstSet = firstSet || b;
  }
  renderArchive(archive);
  // 新弾があれば新弾から、無ければ登録カードから表示する
  if (firstSet) firstSet.click(); else setMode("reg", regBtn);
});
</script>
