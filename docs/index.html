<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>デュエマ予約確認</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2127; --sub: #5f6b7a; --line: #e2e6eb;
    --open: #0f8a4a; --open-bg: #e3f6ec; --before: #b26b00; --before-bg: #fff3dc;
    --soldout: #6b7280; --soldout-bg: #eef0f3; --error: #c62828; --error-bg: #fde8e8;
    --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e7eaee; --sub: #9aa5b1; --line: #2b323b;
      --open: #4ad08a; --open-bg: #12321f; --before: #f0b44c; --before-bg: #3a2c12;
      --soldout: #a0a8b3; --soldout-bg: #262c33; --error: #ff7b7b; --error-bg: #3b1a1a;
      --accent: #58a6ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .about { color: var(--sub); font-size: .85rem; margin: 0 0 8px; line-height: 1.6; }
  .news { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0 0 8px; font-size: .85rem; }
  .news b { font-size: .8rem; }
  .news ul { margin: 4px 0 0; padding-left: 1.2em; }
  .meta { color: var(--sub); font-size: .85rem; margin-bottom: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 8px 0 12px; }
  .tabs a { padding: 8px 18px; color: var(--sub); text-decoration: none; font-weight: 600;
            border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  .shops { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .shop { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .shop a { color: var(--text); text-decoration: none; font-weight: 600; }
  .shop .when { color: var(--sub); font-size: .78rem; }
  .shop .err { color: var(--error); font-size: .78rem; margin-top: 4px; }
  .badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .s-open { color: var(--open); background: var(--open-bg); }
  .s-before { color: var(--before); background: var(--before-bg); }
  .s-soldout { color: var(--soldout); background: var(--soldout-bg); }
  .s-error { color: var(--error); background: var(--error-bg); }
  .s-new { color: #fff; background: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tools button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; }
  .tools button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tools input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--card);
                 color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: .95rem; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { background: var(--card); border: 1px solid var(--line); border-left-width: 5px;
                border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  ul.items li.open { border-left-color: var(--open); }
  ul.items li.before { border-left-color: var(--before); }
  ul.items li.soldout { border-left-color: var(--soldout); opacity: .85; }
  ul.items li.jump { outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color 1.5s; }
  ul.items li { scroll-margin-top: 12px; }
  .item-title { color: var(--text); text-decoration: none; font-weight: 600; word-break: break-word; }
  .item-title:hover { text-decoration: underline; }
  .item-sub { color: var(--sub); font-size: .8rem; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .mercari { color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
             border-radius: 999px; padding: 0 8px; font-size: .75rem; white-space: nowrap; }
  .thumb { width: 56px; height: 78px; object-fit: contain; border-radius: 4px; background: var(--bg); flex: none; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row .body { flex: 1; min-width: 0; }
  .empty { color: var(--sub); text-align: center; padding: 24px; }
  footer { color: var(--sub); font-size: .78rem; margin: 24px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>デュエマ予約確認</h1>
  <p class="about">デュエル・マスターズの新弾の予約開始、シングルカードの入荷、シングルの相場（値段の動き）をまとめて確認できる個人運営のサイトです。お店のページを定期的に見回って、自動で更新しています。</p>
  <!-- お知らせ：3つのページで同じ内容。オーナーの指示があった時だけ書き足す -->
  <div class="news">
    <b>お知らせ</b>
    <ul>
      <li>10/18 相場機能を追加しました</li>
      <li>10/18 新弾（DM26-EX4）を追加しました</li>
    </ul>
  </div>
  <nav class="tabs" aria-label="ページの切り替え">
    <a href="index.html" aria-current="page">予約</a>
    <a href="single.html">シングル</a>
    <a href="chart.html">相場</a>
    <a href="duel.html">対戦</a>
  </nav>
  <div class="meta" id="meta">読み込み中…</div>

  <section class="shops" id="shops" aria-label="ショップごとの状況"></section>

  <div class="tools" role="toolbar" aria-label="絞り込み">
    <button data-filter="open" aria-pressed="true">受付中</button>
    <button data-filter="before" aria-pressed="false">受付前</button>
    <button data-filter="soldout" aria-pressed="false">売り切れ</button>
    <button data-filter="all" aria-pressed="false">すべて</button>
    <input id="q" type="search" placeholder="商品名で絞り込み" aria-label="商品名で絞り込み">
  </div>
  <ul class="items" id="items"></ul>

  <footer>5分おきに自動で確認しています（GitHub の混雑時は遅れることがあります）。このページの内容は1時間ごと、または変化があった時に更新されます。</footer>
</main>

<script>
const LABEL = { open: "受付中", before: "受付前", soldout: "売り切れ", error: "取得失敗" };
const ORDER = { open: 0, before: 1, soldout: 2 };
const NEW_DAYS = 7;
let all = [];
let filter = "open";
let showImages = true;

function fmt(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    // お店のデータに変なリンク（javascript: など）が混ざっても使わない
    if ((k === "href" || k === "src") && !/^(https?:|[\w.-]+\.html)/i.test(String(v))) continue;
    e.setAttribute(k, v);
  }
  if (text !== undefined) e.textContent = text;
  return e;
}
// メルカリの検索ページへのリンクを作る（このページがメルカリにアクセスすることはない）
function mercariUrl(title) {
  const code = title.match(/DM\d{2}-[A-Z]+\d+/i);
  const keyword = code
    ? "デュエマ " + code[0]
    : title.replace(/[【\[〔(（][^】\]〕)）]*[】\]〕)）]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40);
  return "https://jp.mercari.com/search?keyword=" + encodeURIComponent(keyword) + "&status=on_sale";
}
function badge(state, text) { return el("span", { class: "badge s-" + state }, text || LABEL[state]); }

function renderShops(shops) {
  const box = document.getElementById("shops");
  box.replaceChildren();
  const list = Object.values(shops).filter(s => s.enabled !== false)
    .sort((a, b) => (ORDER[a.state] ?? 3) - (ORDER[b.state] ?? 3));
  for (const s of list) {
    const card = el("div", { class: "shop" });
    const top = el("div");
    top.append(s.url ? el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.name) : el("strong", {}, s.name), " ", badge(s.state));
    const when = s.checked_at ? "最終確認 " + fmt(s.checked_at) : Object.keys(s.items || {}).length + " 件（人が登録）";
    card.append(top, el("div", { class: "when" }, when));
    if (s.error_count) card.append(el("div", { class: "err" }, s.last_error || "取得に失敗しています"));
    box.append(card);
  }
}

function renderItems() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("items");
  box.replaceChildren();
  const rows = all
    .filter(i => filter === "all" || i.state === filter)
    .filter(i => !q || i.title.toLowerCase().includes(q))
    .sort((a, b) => (ORDER[a.state] - ORDER[b.state]) || (b.first_seen || "").localeCompare(a.first_seen || ""));
  if (!rows.length) { box.append(el("li", { class: "empty" }, "該当する商品はありません")); return; }
  const now = Date.now();
  for (const i of rows.slice(0, 300)) {
    const li = el("li", { class: i.state, id: "i-" + i.key });
    const row = el("div", { class: "row" }), body = el("div", { class: "body" });
    if (showImages && i.image) row.append(el("img", { class: "thumb", src: i.image, alt: "", loading: "lazy" }));
    row.append(body);
    li.append(row);
    body.append(el("a", { class: "item-title", href: i.url, target: "_blank", rel: "noopener" }, i.title));
    const sub = el("div", { class: "item-sub" });
    sub.append(badge(i.state));
    if (now - new Date(i.first_seen).getTime() < NEW_DAYS * 864e5) sub.append(badge("new", "NEW"));
    sub.append(el("span", {}, i.shop), el("span", {}, "掲載確認 " + fmt(i.first_seen)), el("span", {}, "状態変化 " + fmt(i.changed_at)));
    sub.append(el("a", { class: "mercari", href: mercariUrl(i.title), target: "_blank", rel: "noopener" }, "メルカリで探す"));
    body.append(sub);
    box.append(li);
  }
}

document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderItems();
}));
document.getElementById("q").addEventListener("input", renderItems);

// お知らせから「index.html#i-お店-番号」で来た時：絞り込みを外して、その商品まで動かして枠を光らせる
function jumpToHash() {
  const key = decodeURIComponent(location.hash.replace(/^#i-/, ""));
  if (!location.hash.startsWith("#i-") || !all.some(i => i.key === key)) return;
  filter = "all";
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.filter === "all")));
  document.getElementById("q").value = "";
  renderItems();
  const li = document.getElementById("i-" + key);
  if (!li) return;
  // 別のページから来た時は画像の読み込みで位置がずれるので、少し待ってもう一度合わせる
  li.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => li.scrollIntoView({ block: "start" }), 700);
  li.classList.add("jump");
  setTimeout(() => li.classList.remove("jump"), 2500);
}
window.addEventListener("hashchange", jumpToHash);

fetch("status.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    const shops = data.shops || {};
    showImages = data.show_images !== false;
    document.getElementById("meta").textContent = "ページ更新 " + fmt(data.saved_at);
    renderShops(shops);
    all = [];
    for (const [shopKey, s] of Object.entries(shops)) {
      if (s.enabled === false) continue;
      for (const [id, i] of Object.entries(s.items || {}))
        all.push({ ...i, key: shopKey + "-" + id, shop: i.shop ? i.shop + "（手動登録）" : s.name });
    }
    renderItems();
    jumpToHash();
  })
  .catch(() => { document.getElementById("meta").textContent = "まだデータがありません（最初の見張りが終わると表示されます）"; });
</script>
<script src="news.js"></script>
</body>
</html>
