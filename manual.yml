# ============================================================
#  手動登録
#  自動では見張れないショップ（Amazon・イオンなど）で予約ページを見つけたら、
#  ここに書き足すと予約ウォッチの一覧ページに載ります。
#  （プログラムがそのショップを見に行くことはありません。通知も送りません）
#
#  書き方：下の「例」をコピーして items: の下に貼り、中身を書き換えます。
#  先頭のスペースの数をそろえてください（タブは使えません）。
#
#  例：
#  - shop: Amazon                                  # ショップ名
#    title: デュエル・マスターズTCG ○○ 1BOX         # 商品名
#    url: https://www.amazon.co.jp/dp/XXXXXXXXXX    # 予約ページのアドレス
#    state: open                                   # open=受付中 / before=受付前 / soldout=売り切れ
#    until: 2026-11-30                             # この日を過ぎたら一覧から消える（書かなくてもOK）
#
#  メルカリの出品の例：
#  - shop: メルカリ
#    title: DM26-EX4 デュエキング FOREVER 2026 未開封BOX
#    url: https://jp.mercari.com/item/mXXXXXXXXXXX
#    state: open
#    until: 2026-10-31
# ============================================================
items:
