# ============================================================
#  見張りの設定ファイル
#  オーナーが書き換えるのはこのファイルだけです。
#  「#」から右はメモ（プログラムは読みません）。
# ============================================================

# ---- 何を見張るか（全ショップ共通） ----
target:
  product: "デュエル・マスターズ"          # 通知に表示する名前
  keywords:                               # 商品名にこのどれかが入っていたら対象
    - "デュエル・マスターズ"
    - "デュエマ"
    - "Duel Masters"
  exclude_keywords: []                    # 商品名にこれが入っていたら対象外（例: ["中古"]）
  include_restock: true                   # 再販も通知するなら true、しないなら false

# ---- 見張るショップ ----
# enabled: false にすると、そのショップは見張りを休みます。
# interval_minutes: 何分おきに見るか（最短5。robots.txt の指定があれば自動でそれ以上空けます）
shops:
  - id: animate
    name: アニメイト通販
    url: "https://www.animate-onlineshop.jp/animetitle/index.php?aid=3346&ss=5&sl=1"
    mode: list            # list = 一覧ページに並ぶ商品を見張る / product = 1つの商品ページを見張る
    fetch: static
    enabled: true
    interval_minutes: 20  # robots.txt で約20分空けるよう指定されているため
    rules:
      item: "div.item_list > ul > li"     # 商品1つ分の枠
      title: "h3 a"                       # 商品名の場所
      link: "h3 a"                        # 商品ページへのリンクの場所
      status: "p.stock"                   # 受付状況が書いてある場所
      id_regex: '/pd/(\d+)'               # リンクから商品番号を取り出す決まり
      open_keywords: ["予約受付中", "在庫あり", "残りわずか", "以内に入荷", "取り寄せ"]
      soldout_keywords: ["販売終了", "品切れ", "完売", "受付終了"]

  - id: hobbysearch
    name: ホビーサーチ
    url: "https://www.1999.co.jp/search?typ1_c=121&searchkey=デュエル・マスターズ&spage=1&sortid=0"
    mode: list
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "div.c-product-list__item"
      title: "div.c-card__title"
      link: "a.c-card__info-links"
      status: "ul.c-card__tags-list"
      id_regex: '/(\d+)$'
      open_keywords: ["予約品", "在庫あり", "在庫僅少", "新入荷"]
      soldout_keywords: ["販売終了", "品切れ", "完売"]

  - id: fullahead
    name: フルアヘッド
    url: "https://fullahead-dm.com/shopbrand/yoyaku/page1/new/"
    mode: list
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "div.indexItemBox > div"
      title: "span.itemName"
      link: "a[href*='/shopdetail/']"
      status: "span.M_item-stock-smallstock, span.soldout"
      id_regex: '/shopdetail/(\d+)'
      all_items: true                     # デュエマ専門店なので、商品名のチェックを省く
      open_keywords: ["残りあと"]
      soldout_keywords: ["sold out"]

# ---- 対象外にしたショップ（メモ） ----
# 次のショップは、規約で禁止されている・プログラムからのアクセスを遮断している等の理由で見張りません。
# 遮断を回避する設定は社是（相手サイトに迷惑をかけない）に反するため、追加しないでください。
#   Amazon / 楽天 / あみあみ / セブンネット / ヨドバシ / ビックカメラ / タカラトミーモール /
#   ジョーシン / イオンスタイルオンライン / トイザらス / エディオン / カードラッシュ /
#   駿河屋・遊々亭（GitHub からのアクセスを拒否されるため） など
