# ============================================================
#  見張りの設定ファイル
#  オーナーが書き換えるのはこのファイルだけです。
#  「#」から右はメモ（プログラムは読みません）。
# ============================================================

# ---- 何を見張るか（全ショップ共通） ----
target:
  product: "デュエル・マスターズ"          # 通知に表示する名前
  keywords:                               # 商品名にこのどれかが入っていたら対象
    - "デュエル・マスターズ"
    - "デュエルマスターズ"
    - "デュエマ"
    - "Duel Masters"
  exclude_keywords:                       # 商品名にこれが入っていたら対象外
    - "(キャラクターグッズ)"
    - "カードスリーブ"                    # 「DXカードスリーブ」「(カードスリーブ)」など
  include_restock: true                   # 再販も通知するなら true、しないなら false

# ---- 見張るショップ ----
# enabled: false にすると、そのショップは見張りを休みます。
# interval_minutes: 何分おきに見るか（最短5。robots.txt の指定があれば自動でそれ以上空けます）
shops:
  - id: hobbysearch
    name: ホビーサーチ
    url: "https://www.1999.co.jp/search?typ1_c=121&cat=toreca&state=&sold=0&sortid=0&searchkey=デュエル・マスターズ"
    mode: list            # list = 一覧ページに並ぶ商品を見張る / product = 1つの商品ページを見張る
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "div.c-product-list__item"    # 商品1つ分の枠
      title: "div.c-card__title"          # 商品名の場所
      link: "a.c-card__info-links"        # 商品ページへのリンクの場所
      status: "ul.c-card__tags-list"      # 受付状況が書いてある場所
      id_regex: '/(\d+)$'                 # リンクから商品番号を取り出す決まり
      open_keywords: ["予約品", "販売中", "在庫あり", "在庫僅少", "新入荷"]
      soldout_keywords: ["在庫なし", "販売終了", "品切れ", "完売"]
      soldout_first: true                 # 「予約品 在庫なし」は売り切れ（予約枠が埋まった）と判定する

  - id: fullahead
    name: フルアヘッド
    url: "https://fullahead-dm.com/shopbrand/yoyaku/page1/new/"
    mode: list
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "div.indexItemBox > div"
      title: "span.itemName"
      link: "a[href*='/shopdetail/']"
      status: "span.M_item-stock-smallstock, span.soldout"
      id_regex: '/shopdetail/(\d+)'
      link_template: "https://fullahead-dm.com/shopdetail/{id}/"   # 一覧のリンクのままだと「ページがありません」になるため
      all_items: true                     # デュエマ専門店なので、商品名のチェックを省く
      open_keywords: ["残りあと"]
      soldout_keywords: ["sold out"]

  - id: mastersquare
    name: マスターズスクウェア
    url: "https://www.tcgacademy.com/product-list/2270"
    mode: list
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "li.list_item_cell"
      title: "span.goods_name"
      link: "a.item_data_link"
      status: "p.stock"
      id_regex: '/product/(\d+)'
      all_items: true                     # デュエマの予約BOX専用コーナーなので、商品名のチェックを省く
      open_keywords: ["在庫数"]
      soldout_keywords: ["在庫なし"]

  - id: cardlabo
    name: カードラボ
    url: "https://www.c-labo-online.jp/product-list/3378"
    mode: list
    fetch: static
    enabled: true
    interval_minutes: 5
    rules:
      item: "li.list_item_cell"
      title: "span.goods_name"
      link: "a.item_data_link"
      status: "p.stock"
      id_regex: '/product/(\d+)'
      open_keywords: ["受付中", "在庫数"]
      soldout_keywords: ["在庫なし"]

# ---- 対象外にしたショップ（メモ） ----
# 次のショップは、規約で禁止されている・プログラムからのアクセスを遮断している等の理由で見張りません。
# 遮断を回避する設定は社是（相手サイトに迷惑をかけない）に反するため、追加しないでください。
#   Amazon / 楽天 / あみあみ / セブンネット / ヨドバシ / ビックカメラ / タカラトミーモール /
#   ジョーシン / イオンスタイルオンライン / トイザらス / エディオン / カードラッシュ /
#   駿河屋・遊々亭・アニメイト通販（GitHub からのアクセスを拒否されるため） など
